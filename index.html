<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Order</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div>

        <header>

            <div>
                <span>✦</span>
                <h1>Task Order</h1>
            </div>

            <div>

                <div>
                    <span id="count-total">0</span>
                    <span>total</span>
                </div>

                <div>
                    <span id="count-concluidas">0</span>
                    <span>concluídas</span>
                </div>

                <div>
                    <span id="count-pendentes">0</span>
                    <span>pendentes</span>
                </div>

            </div>
        </header>

        <main>

            <aside>

                <div>
                    <h2>Nova Tarefa</h2>

                    <p>
                        Preencha os campos abaixo
                    </p>
                </div>

                <div>

                    <div>

                        <label for="task-title">
                            <span>◆</span>
                            Título
                        </label>

                        <input id="task-title" type="text" placeholder="Ex: Estudar para a prova..." maxlength="80"
                            autocomplete="off">

                        <span id="erro-titulo"></span>

                    </div>
                        
                    <div>

                        <label for="task-desc">
                            <span>◆</span>
                            Descrição
                        </label>

                        <textarea id="task-description" placeholder="Descreva os detalhes da tarefa..." maxlength="300"
                            rows="4"></textarea>

                        <div>
                            <span>0</span>/300
                        </div>

                        <span></span>

                    </div>

                    <div>

                        <label>
                            <span>◆</span>
                            Prioridade
                        </label>

                        <div>

                            <label>

                                <input type="radio" name="priority" value="baixa">

                                <span>
                                    <span></span>
                                    Baixa
                                </span>

                            </label>

                            <label>

                                <input type="radio" name="priority" value="média" checked>

                                <span>
                                    <span></span>
                                    Média
                                </span>

                            </label>

                            <label>

                                <input type="radio" name="priority" value="alta">

                                <span>
                                    <span></span>
                                    Alta
                                </span>

                            </label>

                            <label>

                                <input type="radio" name="priority" value="EXTREMAMENTE ALTA">

                                <span>
                                    <span></span>
                                    EXTREMAMENTE ALTA
                                </span>

                            </label>

                        </div>

                        <span></span>

                    </div>

                    <button id="btn-adicionar" type="button">
                        <span>+</span>
                        <span >Adicionar Tarefa</span>
                    </button>

                </div>

                <div>

                    <h3>
                        Filtrar & Ordenar
                    </h3>

                    <div>

                        <label>
                            Status
                        </label>

                        <div>

                            <button data-filter="todas">
                                Todas
                            </button>

                            <button data-filter="pendente">
                                Pendentes
                            </button>

                            <button data-filter="concluida">
                                Concluídas
                            </button>

                        </div>
                    </div>

                    <div>

                        <label>
                            Prioridade
                        </label>

                        <div>

                            <button data-priority="todas">
                                Todas
                            </button>

                            <button data-priority="EXTREMAMENTE ALTA">
                                Extremamente Alta
                            </button>

                            <button data-priority="alta">
                                Alta
                            </button>

                            <button data-priority="média">
                                Média
                            </button>

                            <button data-priority="baixa">
                                Baixa
                            </button>

                        </div>
                    </div>

                </div>
            </aside>

            <section>

                <div>

                    <h2>
                        Suas Tarefas
                    </h2>

                    <div>

                        <button id="btn-limpar" type="button">
                            Limpar tudo
                        </button>

                    </div>
                </div>

                <div id="task-list"></div>

                <div >

                    <div>📋</div>

                    <p>
                        Nenhuma tarefa ainda.
                    </p>

                    <p>
                        Adicione sua primeira tarefa ao lado!
                    </p>

                </div>

            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
